name: Build and publish Kodi repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare package folders
        run: |
          set -euo pipefail
          mkdir -p build site
          cp -R plugin.video.hlemistcinema build/
          cp -R repository.hlemistcinema build/
          cd build
          zip -qr ../site/plugin.video.hlemistcinema-0.1.0.zip plugin.video.hlemistcinema
          zip -qr ../site/repository.hlemistcinema-0.1.0.zip repository.hlemistcinema

      - name: Generate Kodi repository index
        run: |
          set -euo pipefail
          cat > site/addons.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <addons>
            <addon id="plugin.video.hlemistcinema" name="Hlemist Cinema" version="0.1.0" provider-name="HlemistCz">
              <requires><import addon="xbmc.python" version="3.0.0"/></requires>
              <extension point="xbmc.python.pluginsource" library="default.py"><provides>video</provides></extension>
              <extension point="xbmc.addon.metadata">
                <summary lang="cs_CZ">Multimediální vyhledávání pro Kodi</summary>
                <description lang="cs_CZ">Nezávislý doplněk Hlemist Cinema.</description>
                <platform>all</platform>
                <license>License not yet selected</license>
              </extension>
            </addon>
            <addon id="repository.hlemistcinema" name="Hlemist Cinema Repository" version="0.1.0" provider-name="HlemistCz">
              <extension point="xbmc.addon.repository" name="Hlemist Cinema Repository">
                <dir>
                  <info compressed="false">https://hlemistcz.github.io/HlemistCinema/addons.xml</info>
                  <checksum>https://hlemistcz.github.io/HlemistCinema/addons.xml.md5</checksum>
                  <datadir zip="true">https://hlemistcz.github.io/HlemistCinema/</datadir>
                </dir>
              </extension>
              <extension point="xbmc.addon.metadata">
                <summary lang="cs_CZ">Oficiální repozitář Hlemist Cinema</summary>
                <description lang="cs_CZ">Instalace a aktualizace doplňku Hlemist Cinema.</description>
                <platform>all</platform>
                <license>License not yet selected</license>
              </extension>
            </addon>
          </addons>
          XML
          md5sum site/addons.xml | awk '{print $1}' > site/addons.xml.md5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
